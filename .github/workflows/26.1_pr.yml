name: Build PR snapshot (26.1)

on:
  pull_request:
    paths:
      - '**.gradle'
      - '**.properties'
      - '**/src/**'
    branches:
      - "26.1"
    types: [ opened, synchronize, reopened ]
  workflow_call:
  push:
  
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Setting mod version
        run: |
          cat $GITHUB_WORKSPACE/gradle.properties | grep ^archives_base_name= >> 26.1
          cat $GITHUB_WORKSPACE/gradle.properties | grep ^minecraft_version= >> 26.1
          cat $GITHUB_WORKSPACE/gradle.properties | grep ^base_version= >> 26.1
          
      - uses: actions/upload-artifact@v5
        with:
          name: 26.1
          path: |
            **/build/libs/
            !build/libs/
            !**/*-dev.jar
            !**/*-shadow.jar
            !**/*-transformProduction*.jar
            !**/testmod*/
